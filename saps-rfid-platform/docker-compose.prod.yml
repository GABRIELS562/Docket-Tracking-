# ==============================================================================
# SAPS RFID Platform - Production Docker Compose Configuration
# ==============================================================================
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml logs -f
#   docker-compose -f docker-compose.prod.yml down
#
# Prerequisites:
#   - Copy .env.production.example to .env.production
#   - Update all secrets and configuration values
#   - Ensure SSL certificates are in place for production
# ==============================================================================

version: '3.9'

services:
  # ============================================================================
  # TimescaleDB - PostgreSQL with Time-Series Extension
  # ============================================================================
  timescaledb:
    image: timescale/timescaledb:2.13.0-pg15
    container_name: saps-timescaledb-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-saps_rfid}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --encoding=UTF8
      # Performance tuning for production
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-256MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-64MB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'  # Bind to localhost only in production
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./src/infrastructure/database/migrations:/docker-entrypoint-initdb.d:ro
      - ./backups/postgres:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-saps_rfid} && psql -U ${DB_USER:-postgres} -d ${DB_NAME:-saps_rfid} -c "SELECT 1"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - saps-network-prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '10'
        labels: 'service,environment'
    labels:
      - "service=timescaledb"
      - "environment=production"

  # ============================================================================
  # Redis - In-Memory Cache and Message Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: saps-redis-prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --loglevel notice
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'  # Bind to localhost only
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - saps-network-prod
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'
    labels:
      - "service=redis"
      - "environment=production"

  # ============================================================================
  # SAPS RFID Platform - Node.js Backend Application
  # ============================================================================
  saps-rfid-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NODE_ENV: production
    image: saps-rfid-platform:${APP_VERSION:-latest}
    container_name: saps-rfid-backend-prod
    restart: always
    environment:
      # Application
      NODE_ENV: production
      PORT: ${PORT:-8080}
      APP_NAME: ${APP_NAME:-saps-rfid-platform}
      APP_VERSION: ${APP_VERSION:-1.0.0}

      # Database Connection
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-saps_rfid}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-10000}
      DB_SSL_ENABLED: ${DB_SSL_ENABLED:-false}

      # Redis Cache
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-saps:prod:}

      # RFID Configuration
      RFID_READER_IPS: ${RFID_READER_IPS:-}
      RFID_READER_PORT: ${RFID_READER_PORT:-5084}
      RFID_RECONNECT_DELAY: ${RFID_RECONNECT_DELAY:-5000}
      RFID_CONNECTION_TIMEOUT: ${RFID_CONNECTION_TIMEOUT:-10000}
      RFID_TAG_DEDUP_WINDOW: ${RFID_TAG_DEDUP_WINDOW:-3000}
      RFID_MAX_RECONNECT_ATTEMPTS: ${RFID_MAX_RECONNECT_ATTEMPTS:-10}
      RFID_HEALTH_CHECK_INTERVAL: ${RFID_HEALTH_CHECK_INTERVAL:-30000}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: /app/logs/app.log
      LOG_MAX_SIZE: ${LOG_MAX_SIZE:-50m}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-14}
      LOG_JSON: ${LOG_JSON:-true}

      # Security
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      HELMET_ENABLED: ${HELMET_ENABLED:-true}

      # JWT Authentication
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      # WebSocket
      WEBSOCKET_ENABLED: ${WEBSOCKET_ENABLED:-true}
      WEBSOCKET_PATH: ${WEBSOCKET_PATH:-/socket.io}
      WEBSOCKET_PING_TIMEOUT: ${WEBSOCKET_PING_TIMEOUT:-60000}
      WEBSOCKET_PING_INTERVAL: ${WEBSOCKET_PING_INTERVAL:-25000}

      # Metrics
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}

      # Multi-tenant
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}

    ports:
      - '${PORT:-8080}:8080'
    volumes:
      - app_logs:/app/logs
      - ./config:/app/config:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saps-network-prod
    healthcheck:
      test: ['CMD', 'node', '-e', "const http = require('http'); const req = http.get('http://localhost:8080/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.setTimeout(5000, () => { req.destroy(); process.exit(1); });"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'
    labels:
      - "service=saps-rfid-backend"
      - "environment=production"
      - "traefik.enable=true"
      - "traefik.http.routers.saps-api.rule=Host(`api.${DOMAIN:-localhost}`)"
      - "traefik.http.services.saps-api.loadbalancer.server.port=8080"

  # ============================================================================
  # Prometheus - Metrics Collection (Optional)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: saps-prometheus-prod
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    networks:
      - saps-network-prod
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'
    labels:
      - "service=prometheus"
      - "environment=production"
    profiles:
      - monitoring

  # ============================================================================
  # Grafana - Metrics Visualization (Optional)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: saps-grafana-prod
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?GRAFANA_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - saps-network-prod
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'
    labels:
      - "service=grafana"
      - "environment=production"
    profiles:
      - monitoring

  # ============================================================================
  # Nginx Reverse Proxy (Optional - for SSL termination)
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: saps-nginx-prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - saps-rfid-backend
    networks:
      - saps-network-prod
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '10'
    labels:
      - "service=nginx"
      - "environment=production"
    profiles:
      - proxy

# ==============================================================================
# Volumes - Persistent Data Storage
# ==============================================================================
volumes:
  timescaledb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/postgres

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/redis

  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/logs

  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/prometheus

  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/grafana

  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/nginx

# ==============================================================================
# Networks
# ==============================================================================
networks:
  saps-network-prod:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.26.0.0/16
    driver_opts:
      com.docker.network.bridge.enable_icc: 'true'
      com.docker.network.bridge.enable_ip_masquerade: 'true'
