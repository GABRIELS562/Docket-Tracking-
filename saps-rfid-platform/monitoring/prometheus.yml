global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'saps-rfid-monitor'
    environment: 'production'

# Rule files for alerting
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Alertmanager configuration (uncomment when alertmanager is deployed)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # SAPS RFID Application
  - job_name: 'saps-rfid-app'
    static_configs:
      # Use 'saps-rfid-backend' for docker-compose.prod.yml
      # Use 'saps-rfid-app' for docker-compose.yml (development)
      - targets: ['saps-rfid-backend:8080', 'saps-rfid-app:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.+):8080'
        target_label: instance
        replacement: '${1}'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # TimescaleDB Postgres Exporter (if configured)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis Exporter (if configured)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Node Exporter (if configured)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

# Note: Alerting and rule_files are configured at the top of this file
