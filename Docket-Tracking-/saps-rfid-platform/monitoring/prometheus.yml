global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'saps-rfid-monitor'

scrape_configs:
  # SAPS RFID Application
  - job_name: 'saps-rfid-app'
    static_configs:
      - targets: ['saps-rfid-app:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # TimescaleDB Postgres Exporter (if configured)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis Exporter (if configured)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Node Exporter (if configured)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

# Alerting configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files (optional)
# rule_files:
#   - 'alerts/*.yml'
